<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stats, in plain English</title>
<style>
  :root { --bg:#fafaf9; --card:#fff; --text:#292524; --muted:#78716c; --line:#d6d3d1; --btn:#1c1917; --btn-h:#44403c; --err:#dc2626; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1c1917; --card:#292524; --text:#f5f5f4; --muted:#a8a29e; --line:#57534e; --btn:#f5f5f4; --btn-h:#d6d3d1; --err:#f87171; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; display:flex; justify-content:center; padding:40px 16px; }
  main { width:100%; max-width:576px; }
  h1 { font-size:24px; margin:0 0 4px; }
  .sub { font-size:14px; color:var(--muted); margin:0 0 24px; }
  label { display:block; font-size:14px; font-weight:500; margin-bottom:4px; }
  textarea { width:100%; border:1px solid var(--line); border-radius:8px; padding:12px; font:inherit; font-size:14px; background:var(--card); color:var(--text); resize:none; margin-bottom:16px; }
  textarea:focus { outline:2px solid var(--muted); }
  button { background:var(--btn); color:var(--bg); border:0; border-radius:8px; padding:10px 16px; font-size:14px; font-weight:500; cursor:pointer; }
  button:hover { background:var(--btn-h); }
  button:disabled { opacity:.5; cursor:default; }
  .err { color:var(--err); font-size:14px; margin:-8px 0 12px; }
  .result { margin-top:24px; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px; }
  .result small { display:block; text-transform:uppercase; letter-spacing:.05em; font-size:12px; color:var(--muted); margin-bottom:8px; }
  .result p { margin:0; font-size:14px; line-height:1.6; white-space:pre-wrap; }
  .foot { margin-top:32px; font-size:12px; color:var(--muted); }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <h1>Stats, in plain English</h1>
  <p class="sub">Paste a statistical result from a paper or assignment. Get back what it actually means, in biology-student terms.</p>

  <label for="context">Biological context (optional, but recommended)</label>
  <textarea id="context" rows="2" maxlength="1000" placeholder="e.g. Sample was infants in hospital with a genetic disorder, comparing survival rates between two treatments"></textarea>

  <label for="input">Statistical result</label>
  <textarea id="input" rows="3" maxlength="1000" placeholder="p = 0.03, n = 45, effect size = 0.6"></textarea>

  <p class="err" id="error" hidden></p>
  <button id="go">Explain in plain language</button>

  <div class="result" id="result" hidden>
    <small>Plain-language explanation</small>
    <p id="text"></p>
  </div>

  <p class="foot">AI-generated explanations can contain mistakes. Check important results with your instructor or a statistician.</p>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const btn = $("go");

  btn.addEventListener("click", async () => {
    const input = $("input").value.trim();
    const context = $("context").value.trim();
    $("error").hidden = true;
    $("result").hidden = true;

    if (!input) {
      $("error").textContent = "Paste a statistical result first.";
      $("error").hidden = false;
      return;
    }

    btn.disabled = true;
    btn.textContent = "Translating...";
    try {
      const r = await fetch("/api/explain", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ input, context }),
      });
      const data = await r.json();
      if (!r.ok || !data.text) throw new Error(data.error || "No response came back. Try again.");
      $("text").textContent = data.text;
      $("result").hidden = false;
    } catch (e) {
      $("error").textContent = e.message || "Something went wrong reaching the translator. Try again.";
      $("error").hidden = false;
    } finally {
      btn.disabled = false;
      btn.textContent = "Explain in plain language";
    }
  });
</script>
</body>
</html>
